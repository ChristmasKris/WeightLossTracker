<div class="screen active" id="weightScreen">
	<nav class="screen-nav">
		<button id="navTracker">Calories</button>
		<button id="navWeight" class="active">Weight</button>
	</nav>
	<div class="container">
		<h1>Weight</h1>
		<input type="number" id="weightInput" placeholder="Weight (kg)" step="0.01" min="0" required/>
		<button id="addWeightBtn" class="btn">Add entry</button>
	</div>
	<div class="weights">
		<h1>All entries</h1>
		<div class="weightsHolder">
			<span class="noWeights">No entries</span>
		</div>
	</div>
</div>
